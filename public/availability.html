<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Availability — Concept Mastery</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--font:'Nunito',sans-serif;--display:'Fredoka One',cursive;--bg:#f0f4ff;--card:#fff;--border:#dde4f5;--text:#1a1a2e;--muted:#6b7280;--blue:#1A5EAB;--gold:#E8A020;--green:#2D8A3E;--red:#C0392B;--purple:#6C3FA0;--radius:14px}
html,body{min-height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}
.topbar{background:var(--blue);padding:.7rem 1.4rem;display:flex;align-items:center;gap:.85rem;box-shadow:0 2px 16px rgba(26,94,171,.35);flex-wrap:wrap}
.topbar-logo{font-family:var(--display);color:#fff;font-size:1.1rem}
.topbar-logo span{color:var(--gold)}
.role-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:.65rem;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:.7rem}
.topbar-name{font-size:.78rem;color:rgba(255,255,255,.8);font-weight:700}
.tb-link{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:.68rem;font-weight:800;padding:4px 10px;border-radius:20px;cursor:pointer;font-family:var(--font);text-decoration:none}
.page{max-width:960px;margin:0 auto;padding:1.5rem 1rem}
.hero{background:linear-gradient(135deg,var(--purple),#8a52c9);border-radius:var(--radius);padding:1.4rem 1.6rem;color:#fff;margin-bottom:1.4rem}
.hero h1{font-family:var(--display);font-size:1.6rem;margin-bottom:.25rem}
.hero p{font-size:.82rem;opacity:.9}
.grid{display:grid;grid-template-columns:340px 1fr;gap:1.2rem;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem}
.card h2{font-size:.95rem;font-weight:900;margin-bottom:.9rem;display:flex;align-items:center;gap:.45rem}
label{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:.7rem 0 .28rem}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1.5px solid var(--border);border-radius:10px;font-family:var(--font);font-size:.85rem;background:#fff;color:var(--text)}
textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.btn{width:100%;margin-top:1rem;padding:.7rem;border:none;border-radius:10px;background:var(--purple);color:#fff;font-family:var(--font);font-size:.9rem;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn-ghost{background:var(--bg);color:var(--muted);border:1.5px solid var(--border)}
.hint{font-size:.66rem;color:var(--muted);margin-top:.3rem}
/* slot list */
.slot{border:1.5px solid var(--border);border-radius:12px;padding:.8rem .9rem;margin-bottom:.7rem;display:flex;align-items:flex-start;gap:.8rem}
.slot.booked{background:#fdf3f2;border-color:#f0c5c0}
.slot-day{min-width:52px;text-align:center;background:var(--bg);border-radius:9px;padding:.4rem .3rem}
.sd-name{font-size:.62rem;font-weight:900;text-transform:uppercase;color:var(--purple)}
.slot-body{flex:1}
.slot-time{font-family:var(--display);font-size:1rem}
.slot-meta{font-size:.72rem;color:var(--muted);margin-top:.15rem}
.pill{display:inline-block;font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:20px;margin-right:.3rem;text-transform:uppercase}
.pill-sub{background:#EAF1FB;color:var(--blue)}
.pill-grade{background:#fff5e0;color:var(--gold)}
.pill-mode{background:#eef7f0;color:var(--green)}
.pill-open{background:#eef7f0;color:var(--green)}
.pill-booked{background:#fdecea;color:var(--red)}
.slot-actions{display:flex;flex-direction:column;gap:.35rem}
.mini{border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:.28rem .55rem;font-size:.66rem;font-weight:800;cursor:pointer;font-family:var(--font);white-space:nowrap}
.mini-red{color:var(--red);border-color:#f0c5c0}
.empty{text-align:center;color:var(--muted);font-size:.82rem;padding:1.5rem}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:.65rem 1.2rem;border-radius:10px;font-size:.8rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:300}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="boot-error" style="display:none;position:fixed;inset:0;background:#f0f4ff;z-index:9999;align-items:center;justify-content:center;font-family:'Nunito',sans-serif"></div>

<div class="topbar">
  <div class="topbar-logo">🎮 Game <span>Studio</span></div>
  <span class="role-badge">👩‍🏫 Teacher</span>
  <div class="topbar-right">
    <a class="tb-link" href="/instructor">← Dashboard</a>
    <span class="topbar-name" id="tb-name"></span>
    <button class="tb-link" onclick="doLogout()">Sign Out</button>
  </div>
</div>

<div class="page">
  <div class="hero">
    <h1>🗓️ My Availability</h1>
    <p>Add the weekly slots you can teach. Parents can search these by your name, grade, or subject.</p>
  </div>

  <div class="grid">
    <!-- Add / edit form -->
    <div class="card">
      <h2 id="form-title">➕ Add a slot</h2>
      <input type="hidden" id="edit-id">
      <label>Subject</label>
      <input id="f-subject" list="subject-list" placeholder="e.g. Math" autocomplete="off">
      <datalist id="subject-list">
        <option>Math</option><option>English</option><option>Science</option>
        <option>CCAT / Gifted Prep</option><option>Coding</option><option>French</option>
      </datalist>

      <div class="row2">
        <div>
          <label>Grade</label>
          <select id="f-grade">
            <option value="">All grades</option>
          </select>
        </div>
        <div>
          <label>Day</label>
          <select id="f-day">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div><label>Start</label><input type="time" id="f-start" value="16:00"></div>
        <div><label>End</label><input type="time" id="f-end" value="17:00"></div>
      </div>

      <div class="row2">
        <div>
          <label>Mode</label>
          <select id="f-mode"><option>Online</option><option>In-person</option></select>
        </div>
        <div>
          <label>Status</label>
          <select id="f-status"><option value="open">Open</option><option value="booked">Booked</option></select>
        </div>
      </div>

      <label>Notes <span style="text-transform:none;font-weight:600">(optional)</span></label>
      <textarea id="f-notes" placeholder="e.g. Focus on fractions & word problems"></textarea>

      <button class="btn" id="save-btn" onclick="saveSlot()">Save slot</button>
      <button class="btn btn-ghost" id="cancel-btn" style="display:none" onclick="resetForm()">Cancel edit</button>
      <div class="hint">Slots repeat every week until you remove them.</div>
    </div>

    <!-- Current slots -->
    <div class="card">
      <h2>📋 My weekly slots</h2>
      <div id="slots"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SURL='https://xoxjcpbruryjcqonzwag.supabase.co';
const SKEY='sb_publishable_Tu7LS4Mjd0YKmYVMIg4Gag_oK4ih9Se';
const sb=window.supabase.createClient(SURL,SKEY);
const DAY_ORDER={Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5,Saturday:6,Sunday:7};

let profile=null, slots=[];

function showBootError(email,msg){
  const el=document.getElementById('boot-error');
  el.style.display='flex';
  el.innerHTML=`<div style="text-align:center;padding:3rem 1.5rem;max-width:380px">
    <div style="font-size:3rem;margin-bottom:1rem">⚠️</div>
    <h2 style="font-family:'Fredoka One',cursive;font-size:1.4rem;margin-bottom:.5rem;color:#1a1a2e">Access Problem</h2>
    <p style="color:#6b7280;font-size:.85rem;line-height:1.6;margin-bottom:.5rem">${msg}</p>
    <p style="color:#6b7280;font-size:.75rem;margin-bottom:1.2rem">Account: <strong>${email||''}</strong></p>
    <button onclick="sb.auth.signOut().then(()=>window.location.href='/')"
      style="background:#1A5EAB;color:#fff;border:none;border-radius:10px;padding:.65rem 1.4rem;font-size:.85rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif">Sign Out</button>
  </div>`;
}

// grade options 1–12
{const g=document.getElementById('f-grade');for(let i=1;i<=12;i++){const o=document.createElement('option');o.value=i;o.textContent='Grade '+i;g.appendChild(o);}}

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='/';return;}
  const {data:{user}}=await sb.auth.getUser();
  let p=null;
  for(let i=0;i<8;i++){
    const {data}=await sb.from('profiles').select('*').eq('id',user.id).single();
    if(data){p=data;break;}
    await new Promise(r=>setTimeout(r,600));
  }
  if(!p){showBootError(user.email,'Profile not found — schema may not be set up in Supabase.');return;}
  if(!['instructor','admin'].includes(p.role)){showBootError(user.email,`Your role is "${p.role}". Only teachers (instructors) can manage availability.`);return;}
  profile=p;
  document.getElementById('tb-name').textContent=p.name;
  await loadSlots();
})();

async function loadSlots(){
  const {data,error}=await sb.from('teacher_availability')
    .select('*').eq('teacher_id',profile.id);
  if(error){renderError(error.message);return;}
  slots=(data||[]).sort((a,b)=>(DAY_ORDER[a.day_of_week]-DAY_ORDER[b.day_of_week])||a.start_time.localeCompare(b.start_time));
  renderSlots();
}

function renderError(msg){
  document.getElementById('slots').innerHTML=
    `<div class="empty">⚠️ Could not load slots.<br><span style="font-size:.72rem">${msg}</span><br><br>
     If this says the table is missing, run <strong>migrations/teacher_availability.sql</strong> in Supabase.</div>`;
}

function renderSlots(){
  const box=document.getElementById('slots');
  if(slots.length===0){box.innerHTML='<div class="empty">No slots yet. Add your first one on the left. 👈</div>';return;}
  box.innerHTML=slots.map(s=>`
    <div class="slot ${s.status==='booked'?'booked':''}">
      <div class="slot-day"><div class="sd-name">${s.day_of_week.slice(0,3)}</div></div>
      <div class="slot-body">
        <div class="slot-time">${s.start_time}–${s.end_time}</div>
        <div style="margin:.35rem 0">
          <span class="pill pill-sub">${esc(s.subject)}</span>
          <span class="pill pill-grade">${s.grade?('Grade '+s.grade):'All grades'}</span>
          <span class="pill pill-mode">${s.mode}</span>
          <span class="pill ${s.status==='booked'?'pill-booked':'pill-open'}">${s.status}</span>
        </div>
        ${s.notes?`<div class="slot-meta">📝 ${esc(s.notes)}</div>`:''}
      </div>
      <div class="slot-actions">
        <button class="mini" onclick="editSlot('${s.id}')">✏️ Edit</button>
        <button class="mini" onclick="toggleStatus('${s.id}')">${s.status==='open'?'📌 Booked':'✅ Open'}</button>
        <button class="mini mini-red" onclick="removeSlot('${s.id}')">🗑 Delete</button>
      </div>
    </div>`).join('');
}

function readForm(){
  const subject=document.getElementById('f-subject').value.trim();
  const start=document.getElementById('f-start').value;
  const end=document.getElementById('f-end').value;
  if(!subject){toast('Enter a subject');return null;}
  if(!start||!end){toast('Set start and end times');return null;}
  if(end<=start){toast('End time must be after start');return null;}
  const gradeVal=document.getElementById('f-grade').value;
  return {
    teacher_id:profile.id,
    teacher_name:profile.name,
    subject,
    grade:gradeVal?parseInt(gradeVal,10):null,
    day_of_week:document.getElementById('f-day').value,
    start_time:start,
    end_time:end,
    mode:document.getElementById('f-mode').value,
    status:document.getElementById('f-status').value,
    notes:document.getElementById('f-notes').value.trim()||null
  };
}

async function saveSlot(){
  const rec=readForm();if(!rec)return;
  const id=document.getElementById('edit-id').value;
  const btn=document.getElementById('save-btn');btn.disabled=true;
  let error;
  if(id){({error}=await sb.from('teacher_availability').update(rec).eq('id',id));}
  else  {({error}=await sb.from('teacher_availability').insert(rec));}
  btn.disabled=false;
  if(error){toast('Error: '+error.message);return;}
  toast(id?'Slot updated':'Slot added');
  resetForm();
  await loadSlots();
}

function editSlot(id){
  const s=slots.find(x=>x.id===id);if(!s)return;
  document.getElementById('edit-id').value=s.id;
  document.getElementById('f-subject').value=s.subject;
  document.getElementById('f-grade').value=s.grade||'';
  document.getElementById('f-day').value=s.day_of_week;
  document.getElementById('f-start').value=s.start_time;
  document.getElementById('f-end').value=s.end_time;
  document.getElementById('f-mode').value=s.mode;
  document.getElementById('f-status').value=s.status;
  document.getElementById('f-notes').value=s.notes||'';
  document.getElementById('form-title').textContent='✏️ Edit slot';
  document.getElementById('save-btn').textContent='Update slot';
  document.getElementById('cancel-btn').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  document.getElementById('edit-id').value='';
  document.getElementById('f-subject').value='';
  document.getElementById('f-grade').value='';
  document.getElementById('f-notes').value='';
  document.getElementById('f-status').value='open';
  document.getElementById('form-title').textContent='➕ Add a slot';
  document.getElementById('save-btn').textContent='Save slot';
  document.getElementById('cancel-btn').style.display='none';
}

async function toggleStatus(id){
  const s=slots.find(x=>x.id===id);if(!s)return;
  const next=s.status==='open'?'booked':'open';
  const {error}=await sb.from('teacher_availability').update({status:next}).eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  toast('Marked '+next);await loadSlots();
}

async function removeSlot(id){
  if(!confirm('Delete this slot?'))return;
  const {error}=await sb.from('teacher_availability').delete().eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  toast('Slot deleted');await loadSlots();
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
async function doLogout(){await sb.auth.signOut();window.location.href='/';}
</script>
</body>
</html>
