<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Game Studio — Concept Mastery</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--font:'Nunito',sans-serif;--display:'Fredoka One',cursive;--bg:#f0f4ff;--card:#fff;--border:#dde4f5;--text:#1a1a2e;--muted:#6b7280;--blue:#1A5EAB;--gold:#E8A020;--green:#2D8A3E;--red:#C0392B;--radius:16px}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden}
.topbar{background:var(--blue);padding:.65rem 1.2rem;display:flex;align-items:center;gap:.8rem;box-shadow:0 2px 16px rgba(26,94,171,.35);position:sticky;top:0;z-index:50}
.topbar-logo{font-family:var(--display);color:#fff;font-size:1.05rem}
.topbar-logo span{color:var(--gold)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.player-name{color:rgba(255,255,255,.9);font-size:.8rem;font-weight:800}
.xp-track{width:60px;height:8px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden}
.xp-fill{height:100%;background:var(--gold);border-radius:8px;transition:width .8s}
.rank-tag{background:var(--gold);color:#1a1a2e;font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:20px}
.logout-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:.68rem;font-weight:800;padding:4px 10px;border-radius:20px;cursor:pointer;font-family:var(--font)}
.day-bar{background:var(--card);border-bottom:1px solid var(--border);padding:.5rem .8rem;display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none}
.day-bar::-webkit-scrollbar{display:none}
.day-chip{flex-shrink:0;padding:.42rem .85rem;border-radius:30px;border:1.5px solid var(--border);background:var(--card);font-size:.75rem;font-weight:800;cursor:pointer;transition:all .2s;color:var(--muted);white-space:nowrap}
.day-chip.active-day{color:#fff;border-color:transparent}
.day-chip.done-day{border-color:var(--green);color:var(--green)}
.day-chip.done-day::after{content:' ✓'}
.day-chip.locked-day{opacity:.45;cursor:not-allowed}
.main{padding:.9rem;max-width:600px;margin:0 auto}
.claude-features{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.9rem}
@media(max-width:480px){.claude-features{grid-template-columns:1fr}}
.cf-card{background:linear-gradient(135deg,#1a1a2e,#2d3561);border-radius:12px;padding:.8rem 1rem;color:#fff}
.cf-tag{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin-bottom:.3rem}
.cf-text{font-size:.78rem;line-height:1.5}
.hero-card{border-radius:var(--radius);padding:1.4rem 1.4rem 1.2rem;color:#fff;margin-bottom:.9rem;position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.15)}
.hero-badge{position:relative;display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25);border-radius:20px;font-size:.62rem;font-weight:800;padding:3px 11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem}
.hero-title{position:relative;font-family:var(--display);font-size:2rem;margin-bottom:.2rem;line-height:1.1}
.hero-tagline{position:relative;font-size:.85rem;opacity:.8;margin-bottom:1rem}
.hero-theme{position:relative;background:rgba(255,255,255,.12);border-radius:10px;padding:.7rem .9rem;font-size:.8rem;line-height:1.55}
.hero-theme strong{display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.5px;opacity:.7;margin-bottom:.2rem}
.inspire-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
.inspire-chip{background:rgba(255,255,255,.2);border-radius:20px;font-size:.75rem;padding:3px 10px;cursor:pointer;border:none;color:#fff;font-family:var(--font)}
.inspire-chip:hover{background:rgba(255,255,255,.32)}
.locked-overlay{background:var(--card);border:2px dashed var(--border);border-radius:var(--radius);padding:3rem 1.5rem;text-align:center;margin-bottom:.9rem}
.locked-overlay .lock-icon{font-size:3.5rem;margin-bottom:.8rem}
.locked-overlay h2{font-family:var(--display);font-size:1.5rem;color:var(--text);margin-bottom:.5rem}
.locked-overlay p{font-size:.83rem;color:var(--muted);line-height:1.6}
.panel-tabs{display:flex;gap:.4rem;margin-bottom:.75rem}
.ptab{flex:1;padding:.65rem .5rem;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:.75rem;font-weight:800;cursor:pointer;transition:all .2s;text-align:center;color:var(--muted)}
.ptab.active-ptab{color:#fff;border-color:transparent}
.ptab-start.active-ptab{background:var(--blue)}
.ptab-up.active-ptab{background:var(--green)}
.ptab-fix.active-ptab{background:var(--red)}
.prompt-label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:.4rem}
.prompt-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.85rem 1rem;cursor:pointer;transition:all .2s;position:relative;margin-bottom:.5rem}
.prompt-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 4px 16px rgba(26,94,171,.1)}
.prompt-card.copied{border-color:var(--green);background:#f0fdf4}
.prompt-emoji{font-size:1.2rem;margin-bottom:.35rem}
.prompt-text{font-size:.82rem;line-height:1.6;color:var(--text)}
.prompt-text .fill{color:var(--blue);font-weight:800;background:var(--bg);border-radius:4px;padding:0 3px}
.copy-hint{font-size:.65rem;color:var(--muted);margin-top:.4rem}
.copied-badge{position:absolute;top:10px;right:10px;background:var(--green);color:#fff;font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:20px;opacity:0;transition:opacity .3s}
.prompt-card.copied .copied-badge{opacity:1}
.upload-section{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.9rem}
.upload-section h3{font-size:.82rem;font-weight:800;color:var(--text);margin-bottom:.25rem}
.upload-section p{font-size:.74rem;color:var(--muted);margin-bottom:.7rem;line-height:1.5}
.upload-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.upload-btn{padding:.6rem 1.1rem;border-radius:10px;border:none;background:var(--blue);color:#fff;font-family:var(--font);font-size:.78rem;font-weight:800;cursor:pointer}
.upload-btn:disabled{opacity:.5;cursor:not-allowed}
.upload-status{font-size:.74rem;color:var(--muted);font-weight:700}
.game-chip{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.4rem .7rem;font-size:.72rem;color:var(--text);display:flex;align-items:center;gap:.5rem;margin-top:.4rem}
.game-chip .chip-date{color:var(--muted);font-size:.65rem;margin-left:auto}
.own-prompt{margin-bottom:1rem}
.own-prompt textarea{width:100%;padding:.8rem 1rem;border-radius:12px;border:1.5px solid var(--border);font-family:var(--font);font-size:.82rem;resize:none;outline:none;line-height:1.55;background:var(--card);color:var(--text)}
.own-prompt textarea:focus{border-color:var(--blue)}
.own-prompt textarea::placeholder{color:var(--muted)}
.own-prompt-row{display:flex;gap:.5rem;margin-top:.4rem}
.copy-own{flex:1;padding:.7rem;border-radius:10px;border:none;background:var(--blue);color:#fff;font-family:var(--font);font-size:.8rem;font-weight:800;cursor:pointer}
.log-own{padding:.7rem 1rem;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-family:var(--font);font-size:.8rem;font-weight:800;cursor:pointer;color:var(--muted)}
.section-heading{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:1rem 0 .5rem;display:flex;align-items:center;justify-content:space-between}
.clear-log{background:none;border:none;font-size:.65rem;color:var(--muted);cursor:pointer;font-family:var(--font)}
.log-empty{background:var(--card);border:1.5px dashed var(--border);border-radius:12px;padding:1.2rem;text-align:center;font-size:.8rem;color:var(--muted)}
.log-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.65rem .85rem;font-size:.76rem;line-height:1.5;margin-bottom:.35rem}
.log-meta{font-size:.62rem;color:var(--muted);margin-top:.25rem}
.log-type{display:inline-block;font-size:.58rem;font-weight:800;padding:1px 7px;border-radius:20px;text-transform:uppercase;margin-right:.4rem}
.log-type.start{background:#EAF1FB;color:var(--blue)}
.log-type.up{background:#eafbee;color:var(--green)}
.log-type.fix{background:#fff0f0;color:var(--red)}
.log-type.custom{background:#f5f0ff;color:#6C3FA0}
.done-section{margin:1.2rem 0;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem}
.done-section h3{font-size:.9rem;font-weight:800;margin-bottom:.3rem}
.done-section p{font-size:.78rem;color:var(--muted);margin-bottom:.9rem;line-height:1.5}
.done-btn{width:100%;padding:.85rem;border-radius:12px;border:none;font-family:var(--font);font-size:.9rem;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;transition:all .2s}
.done-btn.done-state{background:var(--green)}
.confetti-piece{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:9999;animation:cf 1.8s ease-in forwards}
@keyframes cf{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(540deg);opacity:0}}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:#0f2d5a;color:#fff;border-radius:20px;padding:.7rem 1.3rem;font-size:.82rem;font-weight:700;z-index:9999;transition:transform .4s cubic-bezier(.34,1.4,.64,1);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>

const CLAUDE_FEATURES={
  1:['🧠 Claude remembers your whole conversation — no need to repeat yourself','💻 Claude writes complete working code just from your description'],

  9:['❓ Claude loves follow-up questions — keep asking until you fully understand','✅ Ask Claude to check its own work — it spots and fixes its own mistakes'],

};
const RANKS=['Beginner 🌱','Builder 🔨','Creator ✨','Designer 🎨','Game Dev ⚡','Legend 🌟'];
const XPD=100;
const DAYS=[
  {day:1,genre:'Quiz Game',emoji:'🧠',tagline:'Test what you know!',colour:'#6C3FA0',theme:'Pick ANY topic you love — animals, sports, space, food, movies...',chips:['🦁 Animals','⚽ Sports','🚀 Space','🍕 Food','🎬 Movies'],inspiration:'Think of 5 questions only YOUR friends might get wrong. Make it tricky!',starters:[{e:'🎤',t:'Make me a fun quiz game about [YOUR TOPIC] with 5 questions. Make it colourful and exciting. When I get an answer right, show a big celebration. Show the correct answer when I get it wrong.'},{e:'🌈',t:'Create a quiz game about [YOUR TOPIC] for Grade 4 students. Add a score counter, bright colours, and make each question appear one at a time.'},{e:'🏆',t:'Build me a quiz about [YOUR TOPIC]. Make it look like a game show with bright lights and exciting colours. Show my score at the end with a fun message.'}],upgrades:[{e:'⏱️',t:'Add a timer that counts down 15 seconds for each question. If time runs out, show the answer and move to the next question.'},{e:'🎵',t:'Add fun sound effects — a happy sound when I get it right and a buzzer when I get it wrong. Make the correct answer flash green.'},{e:'🏅',t:'Add a final score screen that says something different depending on how well I did — like "Quiz Champion!" if I get them all right.'},{e:'🔀',t:'Make the questions appear in random order every time I play so it feels different each time.'},{e:'🎯',t:'Add 4 answer buttons for each question. Make wrong answers shake when I click them.'}],fixes:[{e:'🖱️',t:'The buttons are not working when I click them. Please fix the clicking so I can select answers.'},{e:'🔢',t:'The score is not going up when I get answers right. Fix the score counter.'},{e:'➡️',t:'The quiz is not moving to the next question after I answer. Fix it so it goes forward automatically.'},{e:'🔡',t:'The text is too small to read easily. Make all the words bigger.'},{e:'🎨',t:'The colours are hard to see. Make the background and text colours easier to read.'}]},
  {day:2,genre:'Maze Game',emoji:'🌀',tagline:'Find your way out!',colour:'#1A5EAB',theme:'Your maze can be a jungle, haunted house, school, castle, or anywhere!',chips:['🐭 Mouse','🦸 Hero','🐸 Frog','🤖 Robot','👻 Ghost'],inspiration:'What is waiting at the end of your maze? Treasure? Pizza? A trophy?',starters:[{e:'🎮',t:'Make me a maze game where I control a [CHARACTER] using arrow keys. The maze should look like a [THEME]. I need to reach the exit to win. Make it colourful with a celebration when I finish.'},{e:'⭐',t:'Create a maze game for kids. I use arrow keys to move through the maze. When I reach the star at the end I win and see a celebration screen.'},{e:'🗺️',t:'Build a maze game where I am a [CHARACTER] trying to reach [GOAL]. Add arrow key controls and show how many steps I have taken.'}],upgrades:[{e:'⏱️',t:'Add a timer that counts how many seconds it takes me to finish. Show my best time so I can try to beat it.'},{e:'🪙',t:'Add collectible coins hidden in the maze that I can pick up for bonus points.'},{e:'📈',t:'Make the maze bigger and add 3 levels that get harder each time I complete one.'},{e:'👾',t:'Add an enemy that wanders around the maze. If it touches me I lose a life.'},{e:'🗺️',t:'Add a small map in the corner that shows where I am in the maze.'}],fixes:[{e:'🧱',t:'My character is walking through the walls. Fix the collision so I cannot go through walls.'},{e:'⌨️',t:'The arrow keys are not moving my character. Fix the controls so arrow keys work.'},{e:'🐢',t:'My character moves too fast and is hard to control. Make the movement slower.'},{e:'🚪',t:'The exit is not showing up on screen. Make the exit clearly visible with a bright colour.'},{e:'👁️',t:'The maze is too hard to see. Make the walls and paths clearer with better colours.'}]},
  {day:3,genre:'Story Adventure',emoji:'📖',tagline:'You choose what happens!',colour:'#D4620E',theme:'A story where every choice changes what happens — YOU are the hero!',chips:['🧙 Wizard','🐉 Dragon','🏴‍☠️ Pirate','🦸 Superhero','🧚 Fairy'],inspiration:'Where does your adventure start? A forest? A spaceship? Your school at midnight?',starters:[{e:'🗺️',t:'Make me a choose-your-own-adventure story where I am a [CHARACTER]. The story starts at [PLACE]. At each step I get 2 choices. Make it exciting with surprises. Use big colourful text.'},{e:'✨',t:'Create a story game where I play as a [CHARACTER] who needs to [GOAL]. Give me choices at each step that lead to different endings. Make it fun for Grade 4 kids.'},{e:'🎭',t:'Build an adventure story set in [PLACE]. I make choices that change what happens. Have at least 3 different endings — one good, one bad, one surprising.'}],upgrades:[{e:'🖼️',t:'Add pictures made from emoji and symbols to show each scene of the story so I can see where I am.'},{e:'🎒',t:'Add an inventory where I can collect items during the story and use them to unlock special choices later.'},{e:'❤️',t:'Add a health meter. Some choices cost health points. If health reaches zero I get a game over.'},{e:'🎵',t:'Add sound effects for different parts of the story — a scary sound, a victory sound, a funny sound.'},{e:'📜',t:'Add a story recap at the end that summarises all the choices I made to get my ending.'}],fixes:[{e:'🖱️',t:'The choice buttons are not working. Fix them so clicking a choice moves the story forward.'},{e:'🔀',t:'The story is jumping to the wrong scene. Fix the story so choices lead to the correct next part.'},{e:'📄',t:'The text is too long and hard to read. Break it into shorter paragraphs with more space.'},{e:'🏁',t:'The ending is not showing up. Fix the game so it knows when the story is finished.'},{e:'🔙',t:'The back button is taking me to the wrong place. Fix the navigation between scenes.'}]},
  {day:4,genre:'Catch Game',emoji:'🎯',tagline:'Catch the good stuff, dodge the bad!',colour:'#2D8A3E',theme:'Things fall from the sky — catch the ones you want, avoid the rest!',chips:['🍎 Fruit','⭐ Stars','💎 Gems','🍕 Pizza','🪙 Coins'],inspiration:'What falls in YOUR game? What should you NEVER catch?',starters:[{e:'🧺',t:'Make a catch game where [GOOD THINGS] fall from the sky and I move a basket left and right to catch them. [BAD THINGS] also fall and I must avoid them. Add a score and 3 lives.'},{e:'🏃',t:'Create a game where I control a [CHARACTER] at the bottom of the screen using arrow keys. Good things fall for points, bad things take away lives. Make it colourful and fast.'},{e:'📈',t:'Build a falling objects game. Good things are [GOOD]. Bad things are [BAD]. I move left and right to catch or dodge. Make things fall faster as my score gets higher.'}],upgrades:[{e:'💨',t:'Make things fall faster as my score gets higher. Add a level counter to show how many levels I have reached.'},{e:'⭐',t:'Add a special golden item that appears sometimes — catching it gives 5 times the normal points.'},{e:'🛡️',t:'Add a shield power-up I can collect that protects me from the next bad item that hits me.'},{e:'💥',t:'Make caught items do a little explosion or pop animation before disappearing.'},{e:'🏆',t:'Add a high score that saves and shows my best score so I can try to beat it next time.'}],fixes:[{e:'⬅️',t:'My basket or character is not moving with the arrow keys. Fix the controls.'},{e:'📦',t:'The falling objects are going off the sides of the screen. Keep everything inside the game area.'},{e:'💔',t:'I am catching bad items but not losing lives. Fix the life counter so it goes down correctly.'},{e:'🎮',t:'The game is not ending when I run out of lives. Fix the game over screen.'},{e:'😴',t:'Everything falls at the same speed and it feels boring. Make things fall at different speeds.'}]},

let profile=null,dayUnlocks={},dbProgress={},myUploads={},activeDay=1,activeTab='start';
const localLog=JSON.parse(localStorage.getItem('cm_log_v3')||'{}');

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='/';return;}
  const {data:{user}}=await sb.auth.getUser();
  // Retry up to 8x with 600ms gap — DB trigger may lag on fresh signup
  let p=null;
  for(let i=0;i<8;i++){
    const {data}=await sb.from('profiles').select('*').eq('id',user.id).single();
    if(data){p=data;break;}
    await new Promise(r=>setTimeout(r,600));
  }
  // Break redirect loop — show error instead of bouncing back to login
  if(!p){
    document.getElementById('boot-error').style.display='flex';
    document.getElementById('boot-error').innerHTML=`
      <div style="text-align:center;padding:3rem 1.5rem">
        <div style="font-size:3rem;margin-bottom:1rem">⚠️</div>
        <h2 style="font-family:'Fredoka One',cursive;font-size:1.5rem;margin-bottom:.5rem">Profile Not Found</h2>
        <p style="color:#6b7280;font-size:.85rem;max-width:320px;margin:0 auto .75rem;line-height:1.6">
          Your account exists but your profile hasn't been set up yet.<br>
          This usually means the database schema hasn't been run in Supabase.
        </p>
        <p style="color:#6b7280;font-size:.78rem;margin-bottom:1.2rem">Logged in as: <strong>${user.email}</strong></p>
        <button onclick="sb.auth.signOut().then(()=>window.location.href='/')"
          style="background:#1A5EAB;color:#fff;border:none;border-radius:10px;padding:.65rem 1.4rem;font-size:.85rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif">
          Sign Out & Try Again
        </button>
      </div>`;
    return;
  }
  if(p.role!=='student'){window.location.href='/';return;}
  profile=p;
  document.getElementById('tb-name').textContent=p.name;
  await Promise.all([loadUnlocks(),loadProgress(),loadUploads()]);
  renderDayBar();renderMain();updateXP();
})();

async function loadUnlocks(){const {data}=await sb.from('day_unlocks').select('*');if(data)data.forEach(r=>dayUnlocks[r.day_number]=r.is_unlocked);}
async function loadProgress(){const {data}=await sb.from('student_progress').select('*').eq('student_id',profile.id);if(data)data.forEach(r=>dbProgress[r.day]=r);}
async function loadUploads(){const {data}=await sb.from('game_uploads').select('*').eq('student_id',profile.id).order('uploaded_at',{ascending:false});if(data)data.forEach(r=>{if(!myUploads[r.day])myUploads[r.day]=[];myUploads[r.day].push(r);});}

async function doLogout(){await sb.auth.signOut();window.location.href='/';}

function updateXP(){
  const done=Object.values(dbProgress).filter(p=>p.completed).length;
  const ri=Math.min(RANKS.length-1,Math.floor(done/2));
  document.getElementById('rank-tag').textContent=RANKS[ri];
  document.getElementById('xp-fill').style.width=((done%2)/2*100)+'%';
}

function renderDayBar(){
  document.getElementById('day-bar').innerHTML=DAYS.map(d=>{
    const done=dbProgress[d.day]?.completed,locked=!dayUnlocks[d.day],active=d.day===activeDay;
    let cls='day-chip';
    if(active)cls+=' active-day';
    if(done)cls+=' done-day';
    if(locked&&!active)cls+=' locked-day';
    const style=active?`background:${d.colour};border-color:${d.colour};color:#fff`:done?'border-color:var(--green);color:var(--green)':'';
    return `<button class="${cls}" style="${style}" onclick="switchDay(${d.day})">Day ${d.day} ${locked?'🔒':d.emoji}</button>`;
  }).join('');
}

function switchDay(n){activeDay=n;activeTab='start';renderDayBar();renderMain();}

function renderMain(){
  const d=DAYS[activeDay-1],locked=!dayUnlocks[activeDay],done=!!dbProgress[activeDay]?.completed;
  const ups=myUploads[activeDay]||[];
  const [cf1,cf2]=CLAUDE_FEATURES[activeDay]||['',''];
  const cfHTML=`<div class="claude-features">
    <div class="cf-card"><div class="cf-tag">💡 Claude Feature of the Day</div><div class="cf-text">${cf1}</div></div>
    <div class="cf-card"><div class="cf-tag">💡 Did You Know?</div><div class="cf-text">${cf2}</div></div>
  </div>`;

  if(locked){
    document.getElementById('main-content').innerHTML=cfHTML+`
    <div class="locked-overlay">
      <div class="lock-icon">🔒</div>
      <h2>Day ${activeDay} is locked</h2>
      <p>Your instructor hasn't unlocked this day yet.<br>Ask them to open it when you're ready!</p>
    </div>`;
    return;
  }

  const chips=d.chips.map(c=>`<button class="inspire-chip" onclick="fillInspire('${c.replace(/'/g,'&#39;')}')">${c}</button>`).join('');
  const arr=activeTab==='start'?d.starters:activeTab==='up'?d.upgrades:d.fixes;
  const cards=arr.map((p,i)=>`
    <div class="prompt-card" id="pc-${activeTab}-${i}" onclick="copyPrompt('${activeTab}',${i})">
      <div class="prompt-emoji">${p.e}</div>
      <div class="prompt-text">${hl(p.t)}</div>
      <div class="copy-hint">👆 Tap to copy — then say it to Claude</div>
      <span class="copied-badge">✓ Copied!</span>
    </div>`).join('');
  const tabLabel=activeTab==='start'?'📋 Pick a starter — copy it, then say it to Claude:':activeTab==='up'?'✨ Already have a game? Make it even more awesome:':'🔧 Something not working? Use one of these:';
  const logItems=(localLog[activeDay]||[]).slice().reverse().map(p=>`
    <div class="log-item"><span class="log-type ${p.type}">${p.type==='start'?'Starter':p.type==='up'?'Upgrade':p.type==='fix'?'Fix It':'My Own'}</span>${p.text}
    <div class="log-meta">${new Date(p.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('');
  const uploadedHTML=ups.map(u=>`<div class="game-chip">📁 ${u.file_name}<span class="chip-date">${new Date(u.uploaded_at).toLocaleDateString()}</span></div>`).join('');

  document.getElementById('main-content').innerHTML=cfHTML+`
    <div class="hero-card" style="background:linear-gradient(135deg,${d.colour},${d.colour}dd)">
      <div class="hero-badge">Day ${d.day} of 10</div>
      <div class="hero-title">${d.emoji} ${d.genre}</div>
      <div class="hero-tagline">${d.tagline}</div>
      <div class="hero-theme"><strong>Today's theme</strong>${d.theme}<div class="inspire-chips">${chips}</div></div>
    </div>
    <div style="background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem;margin-bottom:.9rem;font-size:.82rem;line-height:1.6">
      💡 <strong>Inspiration:</strong> ${d.inspiration}
    </div>
    <div class="panel-tabs">
      <button class="ptab ptab-start ${activeTab==='start'?'active-ptab':''}" onclick="switchTab('start')">🚀 Start Here</button>
      <button class="ptab ptab-up ${activeTab==='up'?'active-ptab':''}" onclick="switchTab('up')">⬆️ Make Better</button>
      <button class="ptab ptab-fix ${activeTab==='fix'?'active-ptab':''}" onclick="switchTab('fix')">🔧 Fix It</button>
    </div>
    <div class="prompt-label">${tabLabel}</div>
    ${cards}
    <div class="own-prompt">
      <div class="prompt-label" style="margin-top:1rem;margin-bottom:.4rem">✍️ Write your own prompt:</div>
      <textarea id="own-text" rows="3" placeholder="Type your own idea here…"></textarea>
      <div class="own-prompt-row">
        <button class="copy-own" onclick="copyOwn()">📋 Copy My Prompt</button>
        <button class="log-own" onclick="logOwn()">📝 Save to Log</button>
      </div>
    </div>
    <div class="upload-section">
      <h3>📤 Upload My Game</h3>
      <p>Finished your ${d.genre}? Upload your HTML file so your instructor can see it!</p>
      <div class="upload-row">
        <input type="file" id="file-in" accept=".html" style="display:none" onchange="handleUpload(event)">
        <button class="upload-btn" id="upload-btn" onclick="document.getElementById('file-in').click()">📁 Choose HTML File</button>
        <span class="upload-status" id="upload-status"></span>
      </div>
      ${ups.length?`<div style="margin-top:.5rem">${uploadedHTML}</div>`:''}
    </div>
    <div class="section-heading">📜 My Prompts Today <button class="clear-log" onclick="clearLog()">Clear</button></div>
    ${logItems?`<div>${logItems}</div>`:'<div class="log-empty">✏️ Your prompts will appear here after you copy them!</div>'}
    <div class="done-section">
      <h3>${done?'✅ Day '+d.day+' Complete!':'🏁 Finished your '+d.genre+'?'}</h3>
      <p>${done?'Amazing! Move to the next day when you\'re ready.':'When your game is working, mark it done to earn your badge!'}</p>
      <button class="done-btn ${done?'done-state':''}" onclick="markDone(${d.day})">${done?'⭐ Badge Earned!':'✔ My Game is Done! (+XP)'}</button>
    </div>
    <div style="height:2rem"></div>`;
}

function hl(t){return t.replace(/\[([^\]]+)\]/g,'<span class="fill">[$1]</span>');}
function switchTab(t){activeTab=t;renderMain();}
function fillInspire(c){const ta=document.getElementById('own-text');if(ta){ta.value=c+' — ';ta.focus();}}

function copyPrompt(type,idx){
  const d=DAYS[activeDay-1],arr=type==='start'?d.starters:type==='up'?d.upgrades:d.fixes;
  clip(arr[idx].t);
  const card=document.getElementById('pc-'+type+'-'+idx);
  if(card){card.classList.add('copied');setTimeout(()=>card.classList.remove('copied'),2000);}
  addToLog(arr[idx].t,type);
  syncPromptUsed();
  showToast('📋 Copied! Now say it to Claude');
}
function copyOwn(){const t=document.getElementById('own-text')?.value.trim();if(!t){showToast('✏️ Write a prompt first!');return;}clip(t);showToast('📋 Copied!');}
function logOwn(){const t=document.getElementById('own-text')?.value.trim();if(!t){showToast('✏️ Write something first!');return;}addToLog(t,'custom');document.getElementById('own-text').value='';showToast('📝 Saved!');renderMain();}
function addToLog(text,type){if(!localLog[activeDay])localLog[activeDay]=[];localLog[activeDay].push({text,type,time:Date.now()});if(localLog[activeDay].length>50)localLog[activeDay]=localLog[activeDay].slice(-50);localStorage.setItem('cm_log_v3',JSON.stringify(localLog));}
function clearLog(){delete localLog[activeDay];localStorage.setItem('cm_log_v3',JSON.stringify(localLog));renderMain();}

async function syncPromptUsed(){
  const cur=dbProgress[activeDay]||{};
  const used=(cur.prompts_used||0)+1;
  await sb.from('student_progress').upsert({student_id:profile.id,day:activeDay,prompts_used:used,completed:cur.completed||false,xp:cur.xp||0,updated_at:new Date().toISOString()},{onConflict:'student_id,day'});
  if(!dbProgress[activeDay])dbProgress[activeDay]={};
  dbProgress[activeDay].prompts_used=used;
}

async function markDone(day){
  if(dbProgress[day]?.completed)return;
  const xp=(dbProgress[day]?.xp||0)+XPD;
  await sb.from('student_progress').upsert({student_id:profile.id,day,completed:true,prompts_used:dbProgress[day]?.prompts_used||0,xp,updated_at:new Date().toISOString()},{onConflict:'student_id,day'});
  if(!dbProgress[day])dbProgress[day]={};dbProgress[day].completed=true;dbProgress[day].xp=xp;
  confetti();showToast('🎉 Day '+day+' badge earned! +'+XPD+' XP!');
  updateXP();renderDayBar();renderMain();
  if(day<10)setTimeout(()=>switchDay(day+1),1600);
  else setTimeout(()=>showToast('🌟 ALL 10 GAMES DONE! You are a real Game Designer!'),1800);
}

async function handleUpload(e){
  const file=e.target.files[0];if(!file)return;
  if(!file.name.toLowerCase().endsWith('.html')){showToast('⚠️ Please upload an HTML file');return;}
  const btn=document.getElementById('upload-btn'),st=document.getElementById('upload-status');
  btn.disabled=true;st.textContent='Uploading…';
  const path=`${profile.id}/day-${activeDay}/${Date.now()}-${file.name}`;
  const {error:upErr}=await sb.storage.from('game-uploads').upload(path,file,{upsert:true});
  if(upErr){btn.disabled=false;st.textContent='';showToast('❌ Upload failed: '+upErr.message);return;}
  await sb.from('game_uploads').insert({student_id:profile.id,student_name:profile.name,day:activeDay,file_name:file.name,storage_path:path});
  btn.disabled=false;st.textContent='';
  if(!myUploads[activeDay])myUploads[activeDay]=[];
  myUploads[activeDay].unshift({file_name:file.name,storage_path:path,uploaded_at:new Date().toISOString()});
  showToast('🎉 Game uploaded! Your instructor can now see it.');
  renderMain();
}

function clip(t){if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>fb(t));else fb(t);}
function fb(t){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function confetti(){const c=['#E8A020','#1A5EAB','#2D8A3E','#D4620E','#6C3FA0','#fff'];for(let i=0;i<28;i++)setTimeout(()=>{const el=document.createElement('div');el.className='confetti-piece';el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${c[~~(Math.random()*c.length)]};animation-duration:${1.2+Math.random()*.9}s;border-radius:${Math.random()>.5?'50%':'2px'}`;document.body.appendChild(el);setTimeout(()=>el.remove(),2500);},i*40);}
</script>
